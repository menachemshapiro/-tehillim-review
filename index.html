<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tehillim — Sign Review</title>
<style>
:root {color-scheme:light;--paper:#f6f7f8;--surface:#fff;--ink:#1c2936;--muted:#526272;--line:#dbe1e8;--navy:#213b5c;--blue:#285da2;--pale:#e9f0fb;--good:#2b7552;--goodbg:#e8f5ec;--amber:#90611b;--amberbg:#fcf2de;--shadow:0 3px 12px #10263a0a;--he:'Noto Serif Hebrew','SBL Hebrew','Ezra SIL','David CLM','Times New Roman',serif}
* {box-sizing:border-box} body {margin:0;background:var(--paper);color:var(--ink);font:15px/1.45 system-ui,-apple-system,'Segoe UI',Arial,sans-serif}button,input,select,textarea {font:inherit}button {cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed} button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #84b8ed;outline-offset:2px} [hidden]{display:none!important}
button{min-height:40px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--ink);padding:6px 11px} button:hover:not(:disabled){border-color:#8caed7;background:#f1f5fa}.primary{background:var(--blue);color:white;border-color:var(--blue)}.primary:hover:not(:disabled){background:#204d89;color:white}.active{background:var(--pale);border-color:#8faed8;color:var(--blue);font-weight:700}
.topline{background:var(--navy);color:#fff;padding:10px 18px;display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}.topline h1{font-size:18px;font-weight:750;margin:0}.topline .subtitle{font-size:12px;color:#d3e0f2}.topline .tools{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.topline button,.topline a{border:1px solid #617b9c;background:#304e72;color:#fff;border-radius:8px;padding:7px 10px;min-height:36px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;font-size:13px;cursor:pointer}.topline button[aria-pressed=true]{background:#dfebfa;color:#183954;border-color:#c7d8f1}.topline a:hover,.topline button:hover{background:#46648a;color:white}
.wrap{max-width:1320px;margin:auto;padding:12px 15px 25px}.toolbar{display:flex;gap:8px 12px;align-items:center;flex-wrap:wrap;padding:6px 0 11px}.toolbar .counter{font-size:14px;font-weight:700;white-space:nowrap}.meter{height:8px;background:#dfe4ea;border-radius:99px;min-width:90px;flex:1;max-width:320px;overflow:hidden}.meter span{display:block;width:0;height:100%;background:#358162;transition:width .2s}.saveState{margin-left:auto;color:var(--good);font-size:12px;font-weight:600}.saveState.error{color:#b12727}.toolbar .small{font-size:12px;color:var(--muted)}
.filters{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 12px}.filters label{display:flex;gap:5px;align-items:center;font-size:12px;color:var(--muted)}.filters select,.filters input{height:38px;padding:6px 9px;border:1px solid var(--line);border-radius:7px;background:var(--surface);max-width:250px;min-width:0}.filters select#groupFilter{max-width:310px}.filters #search{width:190px}.navig{display:flex;align-items:center;gap:7px;min-width:0}.navig button{min-width:44px;font-size:18px;min-height:38px}.navig .position{font-size:13px;font-weight:650;font-variant-numeric:tabular-nums;white-space:nowrap}
.review{border:1px solid var(--line);background:var(--surface);border-radius:12px;box-shadow:var(--shadow);padding:14px}.reviewHead{display:flex;gap:6px 12px;flex-wrap:wrap;align-items:baseline;margin-bottom:8px}.reviewHead .ref{font-size:19px;font-weight:740}.reviewHead .hebref{direction:rtl;font:18px var(--he);color:var(--muted)}.badge{display:inline-block;background:var(--pale);color:var(--blue);font-weight:650;padding:2px 7px;border-radius:6px;font-size:12px}.badge.c{background:var(--amberbg);color:var(--amber)}.badge.done{background:var(--goodbg);color:var(--good)}.page{margin-left:auto;color:var(--muted);font-size:12px}
.slidegrid{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,1fr);gap:16px}.visuals,.inspector{min-width:0}.gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.gallery figure{margin:0;min-width:0;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:#f7f7f7}.gallery figure.kitfigure{grid-column:1/-1}.gallery figcaption{background:#edf1f5;padding:6px 8px;font-size:12px;font-weight:650;color:#334b62}.crop{min-height:155px;display:flex;align-items:center;justify-content:center;overflow:auto;padding:6px;max-width:100%;cursor:zoom-in}.crop img{height:calc(145px * var(--zoom,1));max-width:none;object-fit:contain;display:block}.gallery .kitfigure .crop{min-height:105px}.gallery .kitfigure .crop img{height:calc(96px * var(--zoom,1))}.crop.noimage{color:var(--muted);font-size:12px;cursor:default}.zoomRow{display:flex;gap:7px;align-items:center;justify-content:flex-end;margin-top:7px;flex-wrap:wrap}.zoomRow button{min-height:32px;padding:4px 11px}.zoomRow label{font-size:12px;color:var(--muted)}
.wordbox{background:#fafbfd;border:1px solid var(--line);border-radius:9px;display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-bottom:8px}.wordbox>div{padding:7px 9px;min-width:0}.wordbox .label{font-size:11px;color:var(--muted);font-weight:750;text-transform:uppercase;letter-spacing:.045em}.wordbox .word{direction:rtl;font-family:var(--he);font-size:31px;line-height:1.65;text-align:center;overflow-wrap:anywhere}.signline{display:flex;flex-wrap:wrap;align-items:center;gap:7px 12px;margin-bottom:8px}.signline b{font-size:16px}.signline .signhe{font:17px var(--he);color:var(--blue)}.pattern{font-size:13px;color:#455567;background:#f2f5f9;border-radius:8px;padding:7px 9px;margin:8px 0}.counts{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin:8px 0 10px}.counts div{text-align:center;background:#f5f7f9;border-radius:7px;padding:5px 2px;color:var(--muted);font-size:12px}.counts b{display:block;font-size:20px;color:var(--ink);line-height:1.3}
.question{font-size:16px;font-weight:800;margin:11px 0 8px}.choices{display:grid;gap:6px}.answer{width:100%;display:grid;grid-template-columns:28px 1fr;align-items:center;gap:8px;min-height:45px;text-align:left;border-radius:8px;padding:7px 10px}.answer .digit{font:700 13px system-ui;background:#eef2f5;color:#52647b;width:25px;height:26px;border-radius:6px;display:grid;place-items:center}.answer .hint{display:block;font-weight:400;color:var(--muted);font-size:12px}.answer[aria-pressed=true]{background:var(--goodbg);border-color:#62a887;color:#1c5d41;font-weight:740}.answer[aria-pressed=true] .digit{background:#c9ecd8;color:#205e42}
.subpicker{border:1px solid #afc4df;border-radius:9px;margin-top:9px;padding:11px;background:#f3f7fc}.subpicker h3{font-size:15px;margin:0 0 8px}.subtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.subtabs button{font-size:13px;min-height:32px;padding:4px 9px}.subgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:6px}.subgrid button{display:flex;flex-direction:column;align-items:center;gap:3px;min-height:95px;justify-content:center;padding:7px 3px}.subgrid .glyph{font:40px/1.3 var(--he);height:49px}.subgrid .he{font:14px var(--he)}.subgrid .keyno{font-size:11px;color:var(--muted)}
.notehead{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-top:9px}.notehead label{font-size:12px;font-weight:700;color:var(--muted)}.notehead .smallbtn{min-height:29px;font-size:12px;padding:4px 8px}.notes{width:100%;min-height:56px;border-radius:8px;border:1px solid var(--line);padding:8px 10px;resize:vertical;color:var(--ink);background:#fff}.footactions{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:10px}.footactions .meta{font-size:12px;color:var(--muted)}.footactions button{min-width:100px}.empty{padding:30px;color:var(--muted);text-align:center;border:1px dashed var(--line);border-radius:10px;background:var(--surface)}
.listView{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px}.listItem{text-align:left;background:#fff;border:1px solid var(--line);border-radius:10px;padding:11px;display:grid;gap:5px}.listItem[aria-current=true]{border-color:#2f69a5;background:#f2f7ff}.listItem .top{display:flex;justify-content:space-between;gap:8px}.listItem .ref{font-weight:750}.listItem .word{font:25px/1.4 var(--he);direction:rtl}.listItem .meta{font-size:12px;color:var(--muted)}
dialog{border:0;border-radius:12px;max-width:96vw;width:min(1000px,96vw);padding:0;box-shadow:0 20px 95px #07112070}dialog::backdrop{background:#061629b8}dialog header{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:#f0f3f8;gap:8px}dialog header button{min-height:32px}dialog .dcontent{max-height:78vh;overflow:auto;background:#fff;text-align:center;padding:13px}dialog .dcontent img{height:auto;max-width:none;width:auto;min-height:180px;max-height:none;transform-origin:top left}dialog .modalcontrols{display:flex;align-items:center;gap:8px;justify-content:center;margin:8px}
#statusMsg{font-size:12px;color:var(--muted)}
@media(max-width:870px){.slidegrid{grid-template-columns:minmax(0,1fr)}.gallery{grid-template-columns:repeat(3,minmax(0,1fr))}.gallery figure.kitfigure{grid-column:auto}.gallery .kitfigure .crop{min-height:155px}.gallery .kitfigure .crop img{height:calc(145px * var(--zoom,1))}.crop{min-height:140px}.slidegrid .visuals{order:0}.slidegrid .inspector{order:1}}
@media(max-width:580px){.wrap{padding:7px 8px 18px}.topline{padding:8px 10px}.topline .subtitle{display:none}.topline h1{font-size:16px}.topline .tools{gap:5px}.topline button,.topline a{padding:5px 8px;font-size:12px}.toolbar{gap:6px}.toolbar .meter{flex-basis:80px}.toolbar .saveState{width:100%;margin-left:0}.filters{gap:5px}.filters label{flex:1 1 42%;display:grid;gap:3px}.filters select,.filters input,.filters select#groupFilter{max-width:none;width:100%}.review{padding:9px}.reviewHead .ref{font-size:16px}.reviewHead .hebref{font-size:16px}.page{margin-left:0}.gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;overflow:visible;padding:0 0 4px}.gallery figure,.gallery figure.kitfigure{min-width:0}.gallery .crop,.gallery .kitfigure .crop{min-height:106px;max-height:125px}.gallery .crop img,.gallery .kitfigure .crop img{height:calc(102px * var(--zoom,1))}.gallery figcaption{padding:5px 6px;font-size:11px}.wordbox .word{font-size:25px}.subgrid{grid-template-columns:repeat(3,minmax(0,1fr))}.navig{margin-right:auto}.slidegrid{gap:6px}.zoomRow{margin:3px 0 6px}.notehead{margin-top:6px}}
@media(prefers-reduced-motion:reduce){.meter span{transition:none}}

.notice{background:#fff8e8;border:1px solid #e2d4b0;border-radius:9px;padding:8px 10px;font-size:12px;color:#5c481d;margin:0 0 10px;line-height:1.45} .topline .tools button{white-space:nowrap}
@media(max-width:580px){.notice{font-size:12px;padding:6px 8px}.topline .tools{justify-content:space-between;width:100%}.topline .tools button{min-height:36px}}

body{padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);padding-bottom:env(safe-area-inset-bottom)}
.topline{padding-top:calc(8px + env(safe-area-inset-top))}
.saveState.pending{color:var(--amber)}
.crop img{flex:none;margin:auto}
.crop{justify-content:flex-start;align-items:flex-start}
dialog .dcontent{text-align:left;max-height:69dvh}
@media(pointer:coarse){
 .topline button,.navig button,.zoomRow button,.subtabs button,dialog button{min-height:44px}
 .filters select,.filters input,.notes{font-size:16px}
 .filters .small{display:none}
}
@media(orientation:landscape) and (max-height:530px) and (max-width:1000px){
 .slidegrid{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;align-items:start}
 .slidegrid .visuals{position:sticky;top:4px}
 .gallery{grid-template-columns:repeat(2,minmax(0,1fr))}
 .gallery figure.kitfigure{grid-column:1/-1}
 .gallery .crop,.gallery .kitfigure .crop{min-height:72px;max-height:94px}
 .gallery .crop img,.gallery .kitfigure .crop img{height:calc(78px * var(--zoom,1))}
 .review{padding:9px}
 .topline .subtitle{display:none}
}
</style><link rel="stylesheet" href="phone.css?v=2"></head>
<body class="slide-mode">
<header class="topline"><div><h1>תהלים · Sign Review</h1><div class="subtitle">400 questions · all scans included</div></div>
<div class="tools"><button id="modeBtn" type="button" aria-pressed="true">Slide mode</button><button id="autoBtn" type="button" aria-pressed="true">Auto-next: ON</button><button id="undoBtn" type="button" title="Undo the last answer (U)">↶ Undo</button><button id="exportBtn" type="button" title="Download ALL saved decisions across batches">Backup answers</button><input type="file" id="importFile" accept="application/json,.json" style="display:none"><button type="button" id="importBtn" title="Import decisions from another session">Restore backup</button><input type="file" id="batchFile" accept="application/json,.json" style="display:none"><button type="button" id="batchBtn" title="Open another review JSON for this session (answers remain saved)">Open another batch</button></div></header>
<div class="wrap"><div class="toolbar review-toolbar"><div class="navig"><button id="prev" type="button" title="Previous (←)">‹</button><span class="position" id="position">…</span><button id="next" type="button" title="Next (→)">›</button></div><div class="counter" id="counter">Loading…</div><div class="meter" aria-label="Reviewed progress"><span id="meterFill"></span></div><span class="saveState" id="saveState" role="status">Opening local answer storage…</span><button type="button" id="reviewMenu" aria-expanded="false">Review options</button></div>
<div class="filters" id="reviewFilters"><label>Show<select id="statusFilter"><option value="all">All items</option><option value="open" selected>Unanswered</option><option value="answered">Answered</option></select></label><label>Verdict<select id="verdictFilter"><option value="all">B and C</option><option value="B">B only</option><option value="C">C only</option></select></label><label>Sign group<select id="groupFilter"><option value="all">All groups</option></select></label><label>Search<input id="search" placeholder="Reference, sign, ID…"></label><span class="small">Keys: 1–9 answer · ← → navigate · U undo · A auto-next</span></div>
<main><section id="slideView" aria-label="Single review item"></section><section id="listView" class="listView" hidden aria-label="All review items"></section></main>
<div class="toolbar feedback"><span id="statusMsg" role="status"></span></div></div>
<dialog id="imgModal"><header><b id="modalTitle">Scan</b><button type="button" id="modalClose">Close ✕</button></header><div class="modalcontrols"><button type="button" id="modalMinus">−</button><span id="modalZoomLabel">100%</span><button type="button" id="modalPlus">+</button></div><div class="dcontent" id="modalBody"><img id="modalImage" alt="Enlarged scan"></div></dialog>
<script type="application/json" id="seedAnswers">[]</script>
<script src="review.js?v=2" defer></script></body></html>
